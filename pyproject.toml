[project]
name = "afp"
version = "0.1.0"
description = "Audio fingerprinting: landmark-hash baseline and evaluation tools"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
